# Met le site en ligne sur GitHub Pages et garde les prix à jour.
# À chaque publication : relevé des promos Steam -> public/deals.json -> mise en ligne du dossier public/.
# Si le relevé échoue, rien n'est publié : la version déjà en ligne reste en place.
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    # GitHub saute souvent des passages planifiés. On en demande donc un toutes les 10 minutes,
    # et la tâche « verifier » arrête ceux qui arrivent alors que les prix ont moins de 25 minutes.
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:          # bouton « Run workflow » de l'onglet Actions
    inputs:
      test_email:
        description: "Envoyer un e-mail d'alerte d'exemple à l'adresse d'envoi"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write              # pour l'étape « Garder la planification active »

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Décide s'il faut publier : toujours après un envoi de fichiers ou un lancement manuel ;
  # pour un passage planifié, seulement si les prix en ligne ont au moins 25 minutes.
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publier: ${{ steps.age.outputs.publier }}
    steps:
      - name: Regarder l'âge des prix en ligne
        id: age
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_OUTPUT"
          import os, time, urllib.request
          proprietaire, depot = os.environ["GITHUB_REPOSITORY"].split("/")
          minutes = 9999
          try:
              with urllib.request.urlopen(f"https://{proprietaire}.github.io/{depot}/releve.txt", timeout=20) as reponse:
                  minutes = (time.time() - int(reponse.read().decode().strip())) / 60
          except Exception:
              pass
          planifie = os.environ["GITHUB_EVENT_NAME"] == "schedule"
          print(f"minutes={minutes:.0f}")
          print(f"publier={'non' if planifie and minutes < 25 else 'oui'}")
          EOF

  publier:
    needs: verifier
    if: needs.verifier.outputs.publier != 'non'    # en cas de doute, on publie
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.mise-en-ligne.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Les promos en ligne juste avant ce passage : elles servent à repérer les jeux qui reviennent en promo.
      - name: Garder les promotions d'avant
        continue-on-error: true
        run: curl -fsS --max-time 60 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/deals.json" -o "$RUNNER_TEMP/avant.json"

      - name: Relever les promotions Steam
        run: python3 server.py --export public

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      # Il arrive que GitHub ne retrouve pas tout de suite le dossier qu'il vient de recevoir : on lui laisse un instant.
      - name: Laisser le temps au dossier d'arriver
        run: sleep 20

      - id: mise-en-ligne
        uses: actions/deploy-pages@v5

      # E-mail aux comptes qui ont activé les alertes, quand un de leurs favoris revient en promo.
      # Sans les trois secrets du dépôt, cette étape ne fait rien. Un échec ici ne touche pas au site.
      - name: Prévenir des favoris revenus en promo
        continue-on-error: true
        env:
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: python3 alertes.py "$RUNNER_TEMP/avant.json" public/deals.json

      # Lancement manuel avec la case « test_email » : un e-mail d'exemple part vers l'adresse d'envoi.
      - name: Envoyer un e-mail de test
        if: github.event_name == 'workflow_dispatch' && inputs.test_email
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SUPABASE_SECRET: inutile-pour-le-test
        run: python3 alertes.py "$RUNNER_TEMP/avant.json" public/deals.json --test

      # GitHub suspend les tâches planifiées d'un dépôt resté 60 jours sans activité.
      # Réactiver la tâche à chaque passage remet ce compteur à zéro.
      - name: Garder la planification active
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/publier.yml/enable"
